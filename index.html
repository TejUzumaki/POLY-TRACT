<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POLY-TRACT // GESTURE PHYSICS ENGINE</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Hidden Gem Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/poly-decomp@0.1.0/build/poly-decomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-polygon@3.0.1/dist/d3-polygon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
    
    <style>
        :root {
            --bg: #0a0a0a;
            --fg: #e0e0e0;
            --accent: #00ff9d;
            --border: #1f1f1f;
            --danger: #ff3333;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        canvas { display: block; }
        
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }
        
        #header {
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-mark {
            width: 12px;
            height: 12px;
            background: var(--accent);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }
        
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        
        #status-terminal {
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border);
            padding: 12px;
            font-size: 0.75rem;
            line-height: 1.4;
            backdrop-filter: blur(8px);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
            max-height: 150px;
            overflow: hidden;
        }
        
        .status-line { display: flex; gap: 8px; opacity: 0.8; }
        .status-line.error { color: var(--danger); opacity: 1; }
        .status-line.success { color: var(--accent); opacity: 1; }
        .timestamp { color: #555; }
        
        .action-btn {
            pointer-events: auto;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: background 0.1s ease;
        }
        
        .action-btn:active { background: rgba(0, 255, 157, 0.2); }
        
        #controls { bottom: 180px; left: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="physics-canvas"></canvas>
    </div>
    
    <div id="header" class="ui-layer">
        <div class="logo-mark"></div>
        <h1>POLY-TRACT</h1>
    </div>
    
    <div id="controls" class="ui-layer">
        <button class="action-btn" id="btn-clear">PURGE</button>
    </div>
    
    <div id="status-terminal" class="ui-layer">
        <div id="log-output"></div>
    </div>

    <script>
        // ENGINE STATE
        const Engine = {
            canvas: null,
            ctx: null,
            dimensions: { w: 0, h: 0 },
            libraries: { decomp: false, d3: false, glm: false }
        };
        
        const log = (msg, type = 'info') => {
            const output = document.getElementById('log-output');
            const time = new Date().toTimeString().split(' ')[0];
            const line = document.createElement('div');
            line.className = `status-line ${type}`;
            line.innerHTML = `<span class="timestamp">[${time}]</span> <span>${msg}</span>`;
            output.prepend(line);
            while(output.children.length > 5) output.removeChild(output.lastChild);
        };
        
        function initCore() {
            Engine.canvas = document.getElementById('physics-canvas');
            Engine.ctx = Engine.canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Verify dependencies (No Fake Data Policy)
            if (typeof decomp !== 'undefined') {
                Engine.libraries.decomp = true;
                log('POLY-DECOMP: INITIALIZED', 'success');
            } else { log('POLY-DECOMP: FAILED TO LOAD', 'error'); }
            
            if (typeof d3 !== 'undefined') {
                Engine.libraries.d3 = true;
                log('D3-POLYGON: INITIALIZED', 'success');
            } else { log('D3-POLYGON: FAILED TO LOAD', 'error'); }
            
            if (typeof glMatrix !== 'undefined') {
                Engine.libraries.glm = true;
                log('GL-MATRIX: INITIALIZED', 'success');
            } else { log('GL-MATRIX: FAILED TO LOAD', 'error'); }
            
            log('SYSTEM READY. AWAITING MEDIAPIPE SIGNAL.', 'success');
            drawGrid();
        }
        
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = document.getElementById('canvas-container').getBoundingClientRect();
            Engine.canvas.width = rect.width * dpr;
            Engine.canvas.height = rect.height * dpr;
            Engine.canvas.style.width = `${rect.width}px`;
            Engine.canvas.style.height = `${rect.height}px`;
            Engine.ctx.scale(dpr, dpr);
            Engine.dimensions = { w: rect.width, h: rect.height };
            drawGrid();
        }
        
        // Brutalist Grid Renderer
        function drawGrid() {
            const { w, h } = Engine.dimensions;
            Engine.ctx.clearRect(0, 0, w, h);
            Engine.ctx.strokeStyle = '#111';
            Engine.ctx.lineWidth = 1;
            
            const gridSize = 40;
            for(let x = 0; x < w; x += gridSize) {
                Engine.ctx.beginPath();
                Engine.ctx.moveTo(x, 0);
                Engine.ctx.lineTo(x, h);
                Engine.ctx.stroke();
            }
            for(let y = 0; y < h; y += gridSize) {
                Engine.ctx.beginPath();
                Engine.ctx.moveTo(0, y);
                Engine.ctx.lineTo(w, y);
                Engine.ctx.stroke();
            }
        }
        
        document.getElementById('btn-clear').addEventListener('click', () => {
            drawGrid();
            log('CANVAS PURGED', 'success');
        });
        
        // Boot
        document.addEventListener('DOMContentLoaded', initCore);
    </script>
</body>
</html>
